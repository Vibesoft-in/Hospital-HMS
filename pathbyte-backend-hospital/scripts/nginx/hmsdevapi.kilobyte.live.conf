# Backend API — hmsdevapi.kilobyte.live (DEVELOPMENT)
# Proxies to Node.js/PM2 on port 3000

# Map to determine allowed origin for CORS
server {
    server_name hmsdevapi.kilobyte.live;
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hms.kilobyte.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hms.kilobyte.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    client_max_body_size 100M;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Puppeteer PDF generation can be slow
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
    }
}

server {
    if ($host = hmsdevapi.kilobyte.live) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name hmsdevapi.kilobyte.live;
    return 404; # managed by Certbot
}
