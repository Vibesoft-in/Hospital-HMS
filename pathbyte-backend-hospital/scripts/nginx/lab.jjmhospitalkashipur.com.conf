# Pathlab Frontend — lab.jjmhospitalkashipur.com
# Serves static files from /var/www/html (index.html + assets)

server {
    listen 80;
    server_name lab.jjmhospitalkashipur.com;

    root /var/www/pathbyte-next-build;
    index index.html;

    # Serve static assets with caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # All routes fall back to index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
