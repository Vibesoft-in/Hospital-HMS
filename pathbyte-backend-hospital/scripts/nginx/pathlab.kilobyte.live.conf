# Pathlab Frontend — pathlab.kilobyte.live
# Same static build as lab.jjmhospitalkashipur.com

server {
    listen 80;
    server_name pathlab.kilobyte.live;

    root /var/www/pathbyte-next-build;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
