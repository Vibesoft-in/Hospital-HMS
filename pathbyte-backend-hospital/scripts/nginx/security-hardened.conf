# Security-Hardened Nginx Configuration
# Use this as a template for your production nginx configs

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Block common automated scanners
map $http_user_agent $is_scanner {
    default 0;
    ~*gobuster 1;
    ~*dirbuster 1;
    ~*nikto 1;
    ~*sqlmap 1;
    ~*nmap 1;
    ~*masscan 1;
    ~*zgrab 1;
    ~*acunetix 1;
    ~*nessus 1;
    ~*openvas 1;
    ~*metasploit 1;
}

server {
    listen 80;
    server_name hms.kilobyte.live;

    # Block scanner user agents
    if ($is_scanner) {
        return 403;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Hide nginx version
    server_tokens off;

    # Client limits
    client_max_body_size 25M;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Connection limits
    limit_conn addr 10;

    # Disable unwanted HTTP methods
    if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$) {
        return 405;
    }

    # Block directory traversal attempts
    location ~ \.\. {
        deny all;
        return 404;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block common vulnerability scanners paths
    location ~* /(admin|phpmyadmin|pma|phpinfo|config|backup|old|test|tmp|temp) {
        deny all;
        return 404;
    }

    # Rate limit authentication endpoints
    location ~ ^/api/v1/(auth|hospital-auth|shared-auth) {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        
        # Hide backend errors
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @error_page;
        
        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
    }

    # Rate limit API endpoints
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @error_page;
        
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
    }

    # ABDM callbacks (more permissive as external service)
    location ~ ^/(v0.5|api/v3) {
        limit_req zone=api burst=50 nodelay;
        
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        
        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
    }

    # Status endpoint (minimal rate limit)
    location /status {
        limit_req zone=general burst=5 nodelay;
        
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # General rate limiting for other paths
    location / {
        limit_req zone=general burst=10 nodelay;
        
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
    }

    # Custom error page to hide information
    location @error_page {
        internal;
        return 404;
    }

    # Return 404 for all other unmatched locations
    location ~ ^(.*)$ {
        return 404;
    }
}
