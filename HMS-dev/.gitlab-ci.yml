image: node:22

stages:
  - quality
  - release

dependency-inventory:
  stage: quality
  script:
    - npm ci
    - npm run inventory
    - npm run sbom
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - inventory/npm-inventory.json
      - inventory/sbom.cdx.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "production"

dependency-audit:
  stage: quality
  script:
    - npm ci
    - npm run audit:ci
    - npm run audit:all || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "production"

release:
  stage: release
  variables:
    GIT_DEPTH: "0"

  only:
    - dev

  before_script:
    - npm ci
    - |
      if [ -z "${GL_TOKEN:-${GITLAB_TOKEN:-}}" ]; then
        echo "Missing GL_TOKEN or GITLAB_TOKEN. Add it in GitLab CI/CD variables and make sure it is available on the dev branch."
        exit 1
      fi
    - |
      if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
        echo "Missing SLACK_WEBHOOK_URL. Add it in GitLab CI/CD variables and make sure it is available on the dev branch."
        exit 1
      fi
    - git config user.name "semantic-release-bot"
    - git config user.email "semantic-release-bot@users.noreply.gitlab.com"
    - git remote set-url origin "https://oauth2:${GL_TOKEN:-$GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

  script:
    - |
      BEFORE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

      npx semantic-release

      AFTER_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

      if [ "$BEFORE_TAG" = "$AFTER_TAG" ]; then
        echo "No new release was created. Skipping Slack notification."
        exit 0
      fi

      CHANGELOG=$(
        awk '
          /^# / || /^## / {
            if (seen) exit
            seen = 1
          }
          seen { print }
        ' CHANGELOG.md 2>/dev/null \
          | sed -E 's/\[([^]]+)\]\([^)]+\)/\1/g' \
          | sed -E 's/ \([0-9a-f]{7,40}\)//g' \
          | head -c 3000
      )

      if [ -z "$CHANGELOG" ]; then
        CHANGELOG="Release $AFTER_TAG was created."
      fi

      export SLACK_MESSAGE="$(printf 'New Release in *%s* (%s)\n\n%s' "$CI_PROJECT_NAME" "$AFTER_TAG" "$CHANGELOG")"

      node -e 'process.stdout.write(JSON.stringify({ text: process.env.SLACK_MESSAGE }))' > slack-payload.json

      curl -fsS -X POST -H 'Content-type: application/json' \
        --data @slack-payload.json \
        "$SLACK_WEBHOOK_URL"
