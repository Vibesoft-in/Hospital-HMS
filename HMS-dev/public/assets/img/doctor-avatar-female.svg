<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradFemale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>
    <linearGradient id="coatGradF" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="skinGradFemale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE0CD"/>
      <stop offset="100%" stop-color="#F7BA99"/>
    </linearGradient>
    <linearGradient id="hairGradFemale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4B2D1B"/>
      <stop offset="100%" stop-color="#2C1810"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="64" fill="url(#bgGradFemale)"/>

  <!-- Back Long Hair Flow -->
  <path d="M40 50 C 36 65, 34 85, 38 98 C 42 85, 46 65, 46 55 Z" fill="url(#hairGradFemale)"/>
  <path d="M88 50 C 92 65, 94 85, 90 98 C 86 85, 82 65, 82 55 Z" fill="url(#hairGradFemale)"/>

  <!-- Neck -->
  <rect x="57" y="66" width="14" height="18" rx="4" fill="url(#skinGradFemale)"/>

  <!-- Head / Face -->
  <ellipse cx="64" cy="51" rx="17.5" ry="20" fill="url(#skinGradFemale)"/>

  <!-- Female Hair Styling (Front & Top) -->
  <path d="M42 46 C 42 27, 52 23, 64 23 C 76 23, 86 27, 86 46 C 86 43, 81 33, 64 33 C 47 33, 42 43, 42 46 Z" fill="url(#hairGradFemale)"/>
  <!-- Side bangs -->
  <path d="M43 42 C 43 54, 46 63, 49 66 C 47 60, 46 52, 47 43 Z" fill="url(#hairGradFemale)"/>
  <path d="M85 42 C 85 54, 82 63, 79 66 C 81 60, 82 52, 81 43 Z" fill="url(#hairGradFemale)"/>

  <!-- Ears & Small Pearl Earrings -->
  <circle cx="46.5" cy="52" r="3.5" fill="url(#skinGradFemale)"/>
  <circle cx="81.5" cy="52" r="3.5" fill="url(#skinGradFemale)"/>
  <circle cx="47" cy="56" r="1.5" fill="#FFFFFF"/>
  <circle cx="81" cy="56" r="1.5" fill="#FFFFFF"/>

  <!-- Inner Scrubs (Teal Scrubs) -->
  <polygon points="56,76 72,76 68,98 60,98" fill="#0D9488"/>
  <polygon points="60,76 68,76 64,84" fill="#0F766E"/>

  <!-- White Lab Coat Body -->
  <path d="M22 128 C 22 98, 42 86, 52 84 L 60 128 Z" fill="url(#coatGradF)"/>
  <path d="M106 128 C 106 98, 86 86, 76 84 L 68 128 Z" fill="url(#coatGradF)"/>

  <!-- Lab Coat Lapels -->
  <polygon points="52,84 64,106 58,128 44,88" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.75"/>
  <polygon points="76,84 64,106 70,128 84,88" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.75"/>

  <!-- Stethoscope around neck -->
  <path d="M51 83 C 50 94, 52 105, 56 109 C 58 111, 62 111, 64 109" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M77 83 C 78 94, 76 105, 72 109 C 70 111, 66 111, 64 109" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <!-- Stethoscope bell -->
  <circle cx="64" cy="113" r="5" fill="#64748B" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="64" cy="113" r="2.5" fill="#334155"/>
</svg>
