<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradMale" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF4FF"/>
      <stop offset="100%" stop-color="#CFE2FE"/>
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="skinGradMale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD3B8"/>
      <stop offset="100%" stop-color="#F6B18D"/>
    </linearGradient>
    <linearGradient id="hairGradMale" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="64" fill="url(#bgGradMale)"/>

  <!-- Neck -->
  <rect x="56" y="66" width="16" height="18" rx="4" fill="url(#skinGradMale)"/>

  <!-- Head / Face -->
  <ellipse cx="64" cy="52" rx="19" ry="22" fill="url(#skinGradMale)"/>

  <!-- Male Hair -->
  <path d="M45 48 C 45 32, 54 26, 64 26 C 74 26, 83 32, 83 48 C 83 45, 80 37, 72 36 C 65 35, 59 39, 49 42 C 46 43, 45 46, 45 48 Z" fill="url(#hairGradMale)"/>
  <path d="M45 47 C 43 50, 43 57, 44 59 C 45 54, 46 51, 47 49 Z" fill="url(#hairGradMale)"/>
  <path d="M83 47 C 85 50, 85 57, 84 59 C 83 54, 82 51, 81 49 Z" fill="url(#hairGradMale)"/>

  <!-- Ears -->
  <circle cx="45" cy="53" r="4.5" fill="url(#skinGradMale)"/>
  <circle cx="83" cy="53" r="4.5" fill="url(#skinGradMale)"/>

  <!-- Inner Shirt (Blue Scrubs) -->
  <polygon points="56,76 72,76 68,98 60,98" fill="#0284C7"/>
  <polygon points="60,76 68,76 64,84" fill="#0369A1"/>

  <!-- White Lab Coat Body -->
  <path d="M22 128 C 22 98, 42 86, 52 84 L 60 128 Z" fill="url(#coatGrad)"/>
  <path d="M106 128 C 106 98, 86 86, 76 84 L 68 128 Z" fill="url(#coatGrad)"/>

  <!-- Lab Coat Lapels -->
  <polygon points="52,84 64,106 58,128 44,88" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.75"/>
  <polygon points="76,84 64,106 70,128 84,88" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.75"/>

  <!-- Stethoscope around neck -->
  <path d="M51 83 C 50 94, 52 105, 56 109 C 58 111, 62 111, 64 109" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <path d="M77 83 C 78 94, 76 105, 72 109 C 70 111, 66 111, 64 109" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <!-- Stethoscope bell -->
  <circle cx="64" cy="113" r="5" fill="#64748B" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="64" cy="113" r="2.5" fill="#334155"/>
</svg>
